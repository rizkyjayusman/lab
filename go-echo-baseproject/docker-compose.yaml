services:
  db:
    image: postgres:16-alpine
    container_name: basedb
    environment:
      POSTGRES_USER: baseuser
      POSTGRES_PASSWORD: basepass
      POSTGRES_DB: basedb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseuser -d basedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: echo_api
    ports:
      - "8080:8080"
    environment:
      # Use the service name 'db' as the hostname
      DB_DSN: "postgres://baseuser:basepass@db:5432/basedb?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy