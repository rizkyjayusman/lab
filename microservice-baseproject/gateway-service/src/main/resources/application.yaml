server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${INTERNAL_SERVICES_ORDER_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - JwtAuthFilter

        - id: user-service
          uri: ${INTERNAL_SERVICES_USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/login

jwt:
  secret: ${JWT_SECRET:7b7b1253ee80e3ac9aea2f859f3796129e5a50cbaac52b128a82f6e80d8f129b}
